name: relevix
description: "Data interpolation and bidirectional value mapping from multi-source tabular datasets."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^9.2.1
  csv: ^6.0.0
  excel: ^4.0.6
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
